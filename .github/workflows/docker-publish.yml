name: Docker

on:
  push:
    branches: [main]
    # Publish semver tags as releases.
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pull requests build without logging in, pushing or attesting, so the write scopes are never used there.
    permissions:
      contents: read
      packages: write
      # Mint the OIDC token and write the build provenance attestation.
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is counted from the last release tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve build metadata
        id: build-meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "hash=${SHA:0:7}" >> "$GITHUB_OUTPUT"

          if [ "$REF_TYPE" = "tag" ]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Mirrors `appVersion` in next.config.ts, which versions local builds.
            describe=$(git describe --tags --first-parent --long --abbrev=7 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*')
            [[ $describe =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)-g([0-9a-f]+)$ ]]
            tag=${BASH_REMATCH[1]}
            distance=${BASH_REMATCH[2]}
            hash=${BASH_REMATCH[3]}
            branch=${REF_NAME//[^0-9A-Za-z-]/-}

            # Later commits must sort higher in Sentry, which compares the revision numerically and prereleases as text.
            if [ "$distance" = 0 ]; then
              echo "version=$tag" >> "$GITHUB_OUTPUT"
            elif [ "$branch" = main ]; then
              echo "version=$tag.$distance+$hash" >> "$GITHUB_OUTPUT"
            else
              echo "version=$tag.$distance+$branch.$hash" >> "$GITHUB_OUTPUT"
            fi
          fi

          # ghcr has no uppercase in image names. metadata-action lowercases its own
          # input, the attest step does not, so both read this one.
          echo "image=$REGISTRY/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.build-meta.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.build-meta.outputs.version }}
            NEXT_PUBLIC_COMMIT_HASH=${{ steps.build-meta.outputs.hash }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          # Empty on pull requests, which switches source map upload off rather than
          # minting a Sentry release for every PR build.
          secrets: |
            sentry_auth_token=${{ github.event_name != 'pull_request' && secrets.SENTRY_AUTH_TOKEN || '' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance handled by the attest step below; buildkit's own
          # attestations would push untagged "unknown/unknown" manifests to ghcr.
          provenance: false
          sbom: false

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.build-meta.outputs.image }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          # Keep the attestation in GitHub's store only; pushing to ghcr would add
          # an untagged referrer artifact. Verify with:
          #   gh attestation verify oci://<image> --owner BSStudio
          push-to-registry: false
