name: Set up toolchain
description: pnpm, Node.js from .nvmrc, and a frozen-lockfile install.

runs:
  using: composite
  steps:
    - name: Set up pnpm, Node.js and dependencies
      uses: pnpm/setup@v3.0.0
      with:
        node-version-file: .nvmrc
        cache: true
        require-lockfile: true
