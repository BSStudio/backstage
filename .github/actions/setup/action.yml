name: Set up toolchain

description: pnpm, Node.js from .nvmrc, and a frozen-lockfile install.

runs:
  using: composite
  steps:
    - name: Set up pnpm, Node.js and dependencies
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        node-version-file: .nvmrc
        cache: true
        require-lockfile: true
