name: Set up toolchain
description: pnpm, Node.js from .nvmrc, and a frozen-lockfile install.

runs:
  using: composite
  steps:
    - name: Read the Node.js version
      id: node
      shell: bash
      run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

    - name: Set up pnpm and Node.js
      uses: pnpm/setup@v2.0.2
      with:
        runtime: node@${{ steps.node.outputs.version }}
        cache: true
        install: false

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
