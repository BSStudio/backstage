name: Set up toolchain

description: pnpm, Node.js from .nvmrc, and a frozen-lockfile install.

runs:
  using: composite
  steps:
    - name: Set up pnpm, Node.js and dependencies
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        node-version-file: .nvmrc
        cache: true
        require-lockfile: true
