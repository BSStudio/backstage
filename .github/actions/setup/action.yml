name: Set up toolchain

description: pnpm, Node.js from .nvmrc, and a frozen-lockfile install.

runs:
  using: composite
  steps:
    - name: Set up pnpm, Node.js and dependencies
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        node-version-file: .nvmrc
        cache: true
        require-lockfile: true
